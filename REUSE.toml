# Copyright and licensing for the files that cannot say it themselves. Files
# whose own header names every holder and licence are not listed: the spec,
# the override initrd-pdx246/recovery-init (Jolla's GPL-2.0-only file with
# this port's change marked in it), the tool script and .gitignore.
#
# The initrd/ submodule (mer-hybris/hybris-initrd, GPL-2.0-only, Jolla) is not
# part of this repository; see SUBMODULES.md.
#
# Licences follow the code this builds on: the files written for this port
# are GPL-2.0-only like hybris-initrd (its packages are tagged GPLv2), the
# documentation (NOTES.md, README.md, SUBMODULES.md) is CC-BY-SA-4.0.

version = 1
SPDX-PackageName = "droid-hal-img-boot-pdx246"
SPDX-PackageSupplier = "Johannes Meyer zum Alten Borgloh"
SPDX-PackageDownloadLocation = "NOASSERTION"

# The documentation, written for this port, in a format that carries no
# header by convention.
[[annotations]]
path = ["NOTES.md", "README.md", "SUBMODULES.md"]
SPDX-FileCopyrightText = "Johannes Meyer zum Alten Borgloh"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# .gitmodules is created by "git submodule add" (SUBMODULES.md) and cannot
# carry a header.
[[annotations]]
path = [".gitmodules"]
SPDX-FileCopyrightText = "Johannes Meyer zum Alten Borgloh"
SPDX-License-Identifier = "GPL-2.0-only"

# The patch that produces initrd-pdx246/recovery-init. Its context lines are
# hybris-initrd's recovery-init (holders and years as named in that file's own
# header); the added lines are this port's and, as a change to a GPL-2.0-only
# file, are GPL-2.0-only too.
[[annotations]]
path = "patches/initrd/0001-*.patch"
SPDX-FileCopyrightText = [
    "2025 Jolla Mobile Ltd",
    "2021 Open Mobile Platform LLC.",
    "2013-2015 Jolla Ltd.",
    "Johannes Meyer zum Alten Borgloh",
]
SPDX-License-Identifier = "GPL-2.0-only"

# hybris-initrd's droid-hal-device-img-boot.inc with patches/initrd/0002 (the
# spec includes this copy), and that patch. The .inc carries no header; its
# history in mer-hybris/hybris-initrd (2015-2026) is Jolla's work with a few
# outside contributors. The changed lines are this port's, GPL-2.0-only like
# the file.
[[annotations]]
path = ["initrd-pdx246/droid-hal-device-img-boot.inc", "patches/initrd/0002-*.patch"]
SPDX-FileCopyrightText = [
    "2015-2026 the hybris-initrd authors (Jolla and contributors, see the history of mer-hybris/hybris-initrd)",
    "Johannes Meyer zum Alten Borgloh",
]
SPDX-License-Identifier = "GPL-2.0-only"
